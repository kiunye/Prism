name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Test prism-core
        working-directory: ./prism-core
        run: bundle exec rake test

      - name: Test prism-web
        working-directory: ./prism-web
        run: bundle exec rake test

      - name: Brakeman (prism-web only)
        # brakeman requires a Rails app; prism-core has no Rails so it would error.
        working-directory: ./prism-web
        run: bundle exec brakeman --no-summary --quiet

      - name: Bundler audit (prism-core)
        working-directory: ./prism-core
        run: bundle exec bundle-audit check --update

      - name: Bundler audit (prism-web)
        working-directory: ./prism-web
        run: bundle exec bundle-audit check --update